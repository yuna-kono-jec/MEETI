<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MEETI｜あなたの名刺</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="card">
        <header class="card-header">
            <p class="number" id="number">No.037</p>
            <p class="greeting">
                よろしく<br>お願いします！ ♡
            </p>
        </header>

        <div class="profile">
            <img
                src="images/INFP.png"
                alt="MBTIのイラスト"
                class="profile-image"
                id="profile-image"
            >

            <h1 class="name" id="name">YUNA</h1>
            <p class="mbti" id="mbti">ENFJ / 主人公タイプ</p>
        </div>

        <div class="interests" id="interests">
            <span>音楽</span>
            <span>旅行</span>
            <span>カフェ</span>
        </div>

        <section class="message-box" aria-label="ひとこと">
            <p class="message-label">ひとこと</p>
            <p class="message" id="message">
                話しかけてください！
            </p>
        </section>

        <footer class="footer">
            <p class="logo">MEETI.</p>
            <p class="tagline">Meet your type.</p>
        </footer>
    </main>
</body>
</html>
